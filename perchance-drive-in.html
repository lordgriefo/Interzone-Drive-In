<!-- ================================================================= -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syncopate:wght@400;700;800&display=swap');

  /* Override Perchance body and default output wrapper constraints */
  html, body {
    margin: 0 !important;
    padding: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    max-width: 100vw !important;
    max-height: 100vh !important;
    overflow: hidden !important;
    background: #030308 !important;
    color: #ffffff !important;
    font-family: 'Space Mono', monospace, sans-serif !important;
  }

  #output, .output, .perchance-output, #main-output, div[id*="output"] {
    margin: 0 !important;
    padding: 0 !important;
    max-width: 100vw !important;
    width: 100vw !important;
    height: 100vh !important;
    position: static !important;
  }

  /* Fixed Root Container - covers entire viewport regardless of Perchance wrapper */
  #drivein-root {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    z-index: 9999999 !important;
    background: #030308 !important;
    display: flex !important;
    flex-direction: column !important;
    overflow: hidden !important;
  }

  /* Top HUD Bar */
  #drivein-hud {
    height: 42px !important;
    width: 100% !important;
    flex-shrink: 0 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;
    padding: 0 16px !important;
    background: rgba(5, 5, 12, 0.96) !important;
    border-bottom: 1px solid rgba(255, 107, 0, 0.4) !important;
    backdrop-filter: blur(10px) !important;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.85) !important;
    box-sizing: border-box !important;
    z-index: 1000 !important;
  }

  .hud-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    user-select: none;
  }
  .hud-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 21px;
    letter-spacing: 3px;
    color: #ff6b00;
    text-shadow: 0 0 10px rgba(255, 107, 0, 0.7);
    line-height: 1;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .hud-sub {
    font-family: 'Syncopate', sans-serif;
    font-size: 7.5px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #00e5ff;
    text-transform: uppercase;
  }

  .hud-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .suite-select {
    background: #121020;
    color: #fbbf24;
    border: 1px solid rgba(251, 191, 36, 0.6);
    border-radius: 4px;
    padding: 4px 8px;
    font-family: 'Syncopate', sans-serif;
    font-size: 8px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 0 8px rgba(251, 191, 36, 0.25);
    outline: none;
  }
  .suite-select:hover {
    border-color: #fbbf24;
    box-shadow: 0 0 12px rgba(251, 191, 36, 0.5);
  }

  .btn-hud {
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 4px;
    padding: 4px 10px;
    font-family: 'Syncopate', sans-serif;
    font-size: 8px;
    font-weight: 800;
    letter-spacing: 0.8px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: all 0.15s ease;
    white-space: nowrap;
    text-decoration: none;
  }
  .btn-hud:hover {
    background: rgba(255, 255, 255, 0.16);
    border-color: #fff;
  }
  .btn-studio {
    background: linear-gradient(90deg, #00e5ff, #00b0ff);
    color: #000;
    border-color: #00e5ff;
    box-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
  }
  .btn-studio:hover {
    background: #33ecff;
    box-shadow: 0 0 16px rgba(0, 229, 255, 0.7);
  }

  /* Main Iframe Container - fills remaining height */
  #drivein-body {
    flex: 1 !important;
    width: 100% !important;
    height: calc(100vh - 42px) !important;
    position: relative !important;
    background: #000 !important;
    overflow: hidden !important;
  }

  #drivein-iframe {
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 100% !important;
    border: none !important;
    display: block !important;
  }

  /* Loading Overlay */
  #loading-overlay {
    position: absolute;
    inset: 0;
    background: #030308;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    z-index: 50;
    transition: opacity 0.5s ease;
  }
  .spinner {
    width: 44px;
    height: 44px;
    border: 3px solid rgba(255, 107, 0, 0.2);
    border-top-color: #ff6b00;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>

<div id="drivein-root" style="position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:9999999; background:#030308; display:flex; flex-direction:column; overflow:hidden;">

  <!-- Top Floating HUD Bar -->
  <header id="drivein-hud">
    <div class="hud-brand">
      <div>
        <div class="hud-title">🍿 INTERZONE DRIVE-IN THEATER</div>
        <div class="hud-sub">MOJAVE INTERDIMENSIONAL OUTPOST · EST. 1964</div>
      </div>
    </div>

    <div class="hud-controls">
      <!-- 7-Site Strangelet Creative Suite Quick-Hop Selector -->
      <select class="suite-select" onchange="if(this.value){window.open(this.value,'_blank');this.selectedIndex=0;}" title="Jump across all 7 Strangelet Suite Apps on Perchance">
        <option value="" selected>⚡ STRANGELET SUITE ▾</option>
        <option value="https://perchance.org/strangelet-cine-sampler">📽️ 1. Cine-Sampler (Shot Library v2.0)</option>
        <option value="https://perchance.org/audioarc">🎚️ 2. AudioArc (Storyboards · Scripts · Short Films)</option>
        <option value="https://perchance.org/thelsc">⚛️ 3. The LSC (Lyrics · Mastering · Audio-to-MIDI)</option>
        <option value="https://perchance.org/phase-4-pictures">🎬 4. Phase 4 Pictures (Multi-Influence Screenplay AI)</option>
        <option value="https://perchance.org/face-for-radio">🎙️ 5. Phase 4 Radio (Old-Fashioned Radio Plays)</option>
        <option value="https://perchance.org/the-wunderbar">⚡ 6. The Wunderbar (Music Videos · Characters · Prompts)</option>
        <option value="https://perchance.org/keneticut">🎞️ 7. KenetiCut (Choreography & Living Reel)</option>
        <option value="https://github.com/lordgriefo/Strangelet-Lab/releases">⚡ 8. Strangelet Lab (v2.5 Beta DAW)</option>
        <option value="https://github.com/lordgriefo/strangelet-stitch">🪡 9. Strangelet Stitch (Reel Stitcher)</option>
        <option value="https://perchance.org/as-above-so-below">🔮 10. As Above, So Below (Double LP · Occult Songbook)</option>
      </select>

      <!-- Jump to KenetiCut Choreography Studio -->
      <button class="btn-hud btn-studio" onclick="openStudioView()" title="Switch to KenetiCut Choreography Studio">
        🎬 STUDIO →
      </button>

      <!-- Toggle Fullscreen -->
      <button class="btn-hud" onclick="toggleFullscreen()" title="Toggle full-screen cinema view">
        ⛶ FULLSCREEN
      </button>

      <!-- Vercel Mirror Link -->
      <a href="https://interzone-drive-in.vercel.app/" target="_blank" rel="noopener noreferrer" class="btn-hud" style="color:#00e5ff;" title="Open standalone Vercel deployment">
        VERCEL ↗
      </a>
    </div>
  </header>

  <!-- Drive-In Body with Loading Overlay and Fullscreen Iframe -->
  <div id="drivein-body" style="flex:1; width:100%; height:calc(100vh - 42px); position:relative; background:#000;">
    <div id="loading-overlay">
      <div class="spinner"></div>
      <div style="font-family:'Syncopate',sans-serif; font-size:10px; letter-spacing:2px; color:#ff6b00; font-weight:700;">
        TUNING 99.3 FM CAR SPEAKER TRANSMITTER...
      </div>
      <div style="font-size:9px; color:#888;">
        Loading Drive-In Screen 1 (Feature), Screen 2 (Vegas UFO), Screen 3 (Hey Books) & Screen 4 (Community Reel)
      </div>
    </div>

    <iframe
      id="drivein-iframe"
      src="https://interzone-drive-in.vercel.app/"
      allow="autoplay; clipboard-write; display-capture; camera; microphone; fullscreen"
      onload="onIframeLoaded()"
      style="position:absolute; top:0; left:0; width:100%; height:100%; border:none; display:block;"
    ></iframe>
  </div>

</div>

<script>
  function onIframeLoaded() {
    const overlay = document.getElementById('loading-overlay');
    if (overlay) {
      overlay.style.opacity = '0';
      setTimeout(() => { overlay.style.display = 'none'; }, 500);
    }
  }

  function openStudioView() {
    const frame = document.getElementById('drivein-iframe');
    if (frame) {
      frame.src = 'https://lordgriefo.github.io/strangelet-kineticut-perchance/index.html?tab=editor';
    }
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.warn('Fullscreen error:', err);
      });
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }
  }

  // Fallback timer to hide loader if iframe event fires asynchronously
  setTimeout(onIframeLoaded, 4000);
</script>
