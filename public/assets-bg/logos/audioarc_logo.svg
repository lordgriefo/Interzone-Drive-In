<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="arcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a131f" />
      <stop offset="50%" stop-color="#0e1f30" />
      <stop offset="100%" stop-color="#060c14" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="108" fill="url(#arcBg)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="rgba(34,211,238,0.25)" stroke-width="2" />

  <!-- Outer Audio Arc (Frequency Soundwave Arc) -->
  <path d="M 96 320 A 160 160 0 0 1 416 320" fill="none" stroke="url(#cyanGlow)" stroke-width="12" stroke-linecap="round" filter="url(#neonBlur)" opacity="0.9" />

  <!-- Inner Dynamic Sound Bars -->
  <g transform="translate(136, 170)">
    <rect x="0" y="80" width="12" height="60" rx="6" fill="url(#amberGlow)" />
    <rect x="24" y="50" width="12" height="90" rx="6" fill="url(#cyanGlow)" />
    <rect x="48" y="20" width="12" height="120" rx="6" fill="url(#cyanGlow)" />
    <rect x="72" y="60" width="12" height="80" rx="6" fill="url(#amberGlow)" />
    <rect x="96" y="10" width="12" height="130" rx="6" fill="url(#cyanGlow)" />
    <rect x="120" y="40" width="12" height="100" rx="6" fill="url(#cyanGlow)" />
    <rect x="144" y="70" width="12" height="70" rx="6" fill="url(#amberGlow)" />
    <rect x="168" y="15" width="12" height="125" rx="6" fill="url(#cyanGlow)" />
    <rect x="192" y="45" width="12" height="95" rx="6" fill="url(#cyanGlow)" />
    <rect x="216" y="75" width="12" height="65" rx="6" fill="url(#amberGlow)" />
  </g>

  <!-- Director Clapper Stripes Base -->
  <path d="M 112 360 L 400 360" stroke="rgba(255,255,255,0.18)" stroke-width="3" stroke-linecap="round" />
  <circle cx="256" cy="360" r="7" fill="#fbbf24" filter="url(#neonBlur)" />
</svg>
