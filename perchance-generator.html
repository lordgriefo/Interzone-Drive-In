<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Strangelet KenetiCut — Perchance AI Flipbook Studio</title>
  <style>
    :root {
      --bg: #09090c;
      --panel: #121218;
      --border: #242430;
      --accent: #00ffcc;
      --accent-glow: rgba(0, 255, 204, 0.35);
      --danger: #ff0055;
      --text: #e2e2ec;
      --text-muted: #84849a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--accent);
      text-shadow: 0 0 10px var(--accent-glow);
    }
    .beat-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #2a2a36;
      transition: background 0.05s ease-out;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.05);
    }
    .beat-dot.active {
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }
    .controls-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      flex: 1;
      justify-content: flex-end;
    }
    select, input, button {
      background: #1a1a24;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 7px 11px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: all 0.15s ease;
    }
    select:focus, input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
    }
    button {
      cursor: pointer;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button:hover {
      background: #242436;
      border-color: #3b3b52;
    }
    button.btn-primary {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }
    button.btn-primary:hover {
      background: #33ffdd;
      box-shadow: 0 0 14px var(--accent-glow);
    }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    #prompt-input {
      flex: 1;
      min-width: 280px;
    }
    #reel-strip {
      background: #0d0d12;
      border-bottom: 1px solid var(--border);
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      min-height: 58px;
    }
    .reel-thumb {
      width: 72px;
      height: 44px;
      object-fit: cover;
      border-radius: 3px;
      border: 1px solid #333;
      flex-shrink: 0;
      animation: popIn 0.25s ease-out;
    }
    @keyframes popIn {
      from { transform: scale(0.6); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    #keneticut-frame-container {
      flex: 1;
      position: relative;
      background: #000;
    }
    iframe#keneticut-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .status-badge {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div id="beat-dot" class="beat-dot"></div>
      <h1>KenetiCut · Perchance AI Studio</h1>
      <span id="bpm-badge" class="status-badge">120 BPM</span>
    </div>

    <div class="controls-bar">
      <!-- 20 Curated Presets Dropdown -->
      <select id="preset-selector" onchange="onSelectPreset()">
        <option value="" disabled selected>🎬 Choose a Flipbook Preset (20 themes)...</option>
        <option value="p11">💥 1. Nevada '55: Atomic Rearview Escape</option>
        <option value="p1">🪧 2. Vegas Corridor '59 (Burma-Shave Highway)</option>
        <option value="p2">🌌 3. The 8th Sphere: Enochian Horizon</option>
        <option value="p3">🏍️ 4. Kenneth Anger: Scorpio Rites</option>
        <option value="p4">📻 5. W-OCCULT AM 660 Broadcast Intrusion</option>
        <option value="p5">🏭 6. Eraserhead: Industrial Radiator Shimmer</option>
        <option value="p6">🛋️ 7. The Black Lodge: Chevron Horizon</option>
        <option value="p7">🛸 8. 1956 Drive-In Atomic Invasion</option>
        <option value="p8">🗝️ 9. Maya Deren: Meshes of the Afternoon</option>
        <option value="p9">💊 10. Interzone Burroughs Cut-Up</option>
        <option value="p10">🧬 11. Sacred Geometry Hyperspace</option>
        <option value="p12">🪦 12. Neon Boneyard: Mojave Sign Graveyard</option>
        <option value="p13">🏨 13. The Starlight Motel: Room 13</option>
        <option value="p14">🕶️ 14. Route 375: Black Sedan Pursuit</option>
        <option value="p15">⚡ 15. Wardenclyffe Desert: The Tesla Spire</option>
        <option value="p16">🦋 16. Stan Brakhage: Mothlight Emulsion</option>
        <option value="p17">⏳ 17. Chris Marker: La Jetée Jetty</option>
        <option value="p18">🔮 18. The Fox Sisters: 1920s Spirit Cabinet</option>
        <option value="p19">📂 19. Project Blue Book: Redacted Microfilm</option>
        <option value="p20">🍄 20. Psilocybin Breath: The Living Tapestry</option>
      </select>

      <input id="prompt-input" type="text" placeholder="Type prompt or select a preset..." />

      <select id="frame-count">
        <option value="6">6 Frames (Fast Pop)</option>
        <option value="12" selected>12 Frames (Flipbook)</option>
        <option value="24">24 Frames (Full Reel)</option>
      </select>

      <button id="gen-btn" class="btn-primary" onclick="generateAndStreamReel()">
        <span>🎬</span> Generate Reel
      </button>

      <button onclick="flashSubliminal()" title="Send beat-synced cut-up phrase">
        ⚡ Cut-Up
      </button>

      <button onclick="triggerChop()" title="Instant manual cut">
        ✂️ Cut
      </button>

      <button onclick="togglePlay()" title="Toggle playback">
        ⏯️
      </button>
    </div>
  </header>

  <!-- Live Flipbook Thumbnail Stream Strip -->
  <div id="reel-strip">
    <span id="reel-status" style="font-size: 12px; color: var(--text-muted);">
      Select a preset above and click "Generate Reel" to stream frames directly into KenetiCut.
    </span>
  </div>

  <!-- Embedded KenetiCut Viewport -->
  <div id="keneticut-frame-container">
    <iframe
      id="keneticut-frame"
      src="https://lordgriefo.github.io/strangelet-kineticut-perchance/"
      allow="display-capture; autoplay; cross-origin-isolated"
      allowfullscreen>
    </iframe>
  </div>

  <script>
    // ── 20 Curated Presets Dictionary ──
    const PRESETS = {
      p11: {
        prompt: "Framed tightly inside the vintage chrome rearview mirror of a 1955 car speeding away on dark Nevada desert highway, distant atomic mushroom cloud detonating on horizon, boiling orange fireball and purple radioactive ionization glow, blinding nuclear flash reflecting off windshield and dashboard chrome, 35mm Technicolor cinema frame, motion blur on asphalt",
        style: "strobe"
      },
      p1: {
        prompt: "1950s highway billboards heading into Las Vegas at night, sequential Burma-Shave signs on desert asphalt, glowing neon cactus and arrow motels, taillights of 1957 chrome finned cars, 35mm Kodachrome slide, cinematic depth of field, heat mirage",
        style: "montage"
      },
      p2: {
        prompt: "Giant glowing celestial event horizon over an abandoned desert drive-in theater, rotating Enochian portal ring with golden occult sigils in dark purple sky, eclipse halo, silhouetted lone watcher in trenchcoat, retro Panavision 70mm lens flare",
        style: "dmt_breakthrough"
      },
      p3: {
        prompt: "Kenneth Anger 1965 Scorpio Rising aesthetic, close-up gleaming chrome motorcycle exhaust pipes, leather jacket studs, flickering ritual candles, Luciferian occult neon blue and crimson red gel lighting, 16mm Technicolor grain, blown highlights",
        style: "anger_scorpio"
      },
      p4: {
        prompt: "Analog pirate radio tower under stormy clouds at 3 AM, glowing orange vacuum tubes, glowing phosphor oscilloscope screen waveforms, retro TV test pattern emergency broadcast card, magnetic tape distortion, CRT scanlines, 1980s VHS tape pause glitch",
        style: "magnetic_tape"
      },
      p5: {
        prompt: "David Lynch Eraserhead 1977 aesthetic, stark industrial factory interior, steam radiator emitting white mist, heavy mechanical gears and spinning belts, deep pitch black shadows and tungsten blown highlights, gritty 35mm silver gelatin monochrome film",
        style: "lynch_eraserhead"
      },
      p6: {
        prompt: "Twin Peaks Red Room aesthetic, flowing heavy scarlet velvet curtains, black and white zigzag chevron patterned floor, warm 1940s art-deco floor lamp casting long shadows, dreamlike atmospheric fog, 35mm cinematic film still",
        style: "lynch_redroom"
      },
      p7: {
        prompt: "1956 vintage drive-in movie screen showing retro flying saucer invasion, glowing green beam over a 1950s neon diner parking lot, chrome fins of vintage cars, dramatic B-movie lobby card coloring, two-tone Technicolor, retro movie poster grain",
        style: "montage"
      },
      p8: {
        prompt: "Maya Deren 1943 Meshes of the Afternoon aesthetic, close-up of a bronze skeleton key lying in desert sand turning into a reflection, figure in black cloak with mirror face reflecting clouds, harsh afternoon sun casting geometric shadows, 16mm Bolex black and white film grain",
        style: "deren_meshes"
      },
      p9: {
        prompt: "William S. Burroughs Naked Lunch Interzone aesthetic, 1953 mechanical typewriter with torn newspaper headline collage, cigarette smoke curling under green banker lamp, classified government teletype tape, murky sepia and amber lighting, grainy 16mm spy camera film",
        style: "third_mind"
      },
      p10: {
        prompt: "Intricate sacred geometry portal chamber, glowing neon cyan and magenta fractal mandalas, iridescent holographic lattices, hyper-dimensional crystal refraction, volumetric light rays, dark void background, high symmetry, cinematic 8k render",
        style: "dmt_breakthrough"
      },
      p12: {
        prompt: "Overgrown Mojave desert neon sign boneyard at twilight, tangled pile of massive rusted 1950s casino marquee letters, broken buzzing neon glass tubes glowing dim turquoise and hot pink in sand, cracked porcelain enamel signs, heat distortion, 35mm film grain, moody atmospheric lighting",
        style: "apple_kinetic"
      },
      p13: {
        prompt: "1950s isolated desert roadside motel at 3 AM in rain, buzzing neon red NO VACANCY sign reflecting in wet asphalt puddle, peeling turquoise painted door numbered 13 cracked open, silhouette watcher visible through venetian blinds, noir low-angle camera, Kodachrome vintage film still",
        style: "fiona_voyeur"
      },
      p14: {
        prompt: "Pair of menacing black 1951 government sedans pursuing closely on desert highway at night, twin spotlight beams cutting through dust, chrome bumper grill reflecting red pursuit flashers, long radio whip antennas bending in wind, cinematic 70mm anamorphic lens flare, gritty night grain",
        style: "montage"
      },
      p15: {
        prompt: "Massive copper-wound Nikola Tesla electrical spire standing in dried desert salt flat, violent blinding violet electric lightning arcs discharging into dark storm clouds, copper spheres glowing with plasma aura, vintage 1940s scientific expedition equipment, silver-gelatin black and white film with electric blue toning",
        style: "strobe"
      },
      p16: {
        prompt: "Stan Brakhage 1963 Mothlight experimental film aesthetic, translucent moth wings pressed between clear 16mm celluloid frames, microscopic view of amber insect wing scales and dandelion seeds, hand-scratched razor film cuts, chemical emulsion burns, intense organic abstract texture, macro cinema still",
        style: "brakhage_emulsion"
      },
      p17: {
        prompt: "Chris Marker 1962 La Jetee aesthetic, dramatic high-contrast black and white photography, viewing jetty of 1960s airport terminal, woman face turning toward camera in wind, harsh grey overcast sky, vintage mechanical chronograph stopwatch in foreground, deep film grain, cinematic timeless memory stillness",
        style: "marker_jetee"
      },
      p18: {
        prompt: "1920s spiritualist seance in dark velvet Victorian parlor, glowing white ectoplasm wisp floating from medium hands, tin spirit trumpet levitating above mahogany circular table, startled sitters in antique suits, magnesium powder flashbulb explosion casting harsh shadows, vintage sepia photographic plate",
        style: "seance_dissolve"
      },
      p19: {
        prompt: "Glowing green CRT screen of vintage 1950s microfilm reader machine, classified military UFO incident report with heavy black marker redactions, stamped in red ink TOP SECRET RESTRICTED, grainy black and white saucer photo inset, scratches and dust on microfilm tape, macro angle",
        style: "third_mind"
      },
      p20: {
        prompt: "Ancient mossy forest floor and giant twisted oak roots breathing with bioluminescent turquoise and amber light, bark texture morphing into subtle intricate Celtic knotwork patterns, floating glowing spores in damp evening air, macro shallow depth of field, mystical psychedelic dreamscape",
        style: "psilocybin_breath"
      }
    };

    const BURROUGHS_LINES = [
      "THE WORD IS A VIRUS",
      "REARVIEW MIRROR IGNITION",
      "PAST PORTAL NINE // IN '59",
      "RADIO W-OCCULT AM 660",
      "SILVER GELATIN PROTOCOL",
      "THE OWLS ARE CALLING",
      "DO NOT STOP IN RACHEL",
      "BURMA-SHAVE",
      "TAPE DECAY 0.088",
      "THE 8TH SPHERE REALIGNED"
    ];

    const frame = document.getElementById('keneticut-frame');
    const beatDot = document.getElementById('beat-dot');
    const bpmBadge = document.getElementById('bpm-badge');

    // ── Listen to Beat Events from KenetiCut ──
    window.addEventListener('message', (e) => {
      if (e.data?.type === 'KENETICUT_BEAT') {
        beatDot.classList.add('active');
        setTimeout(() => beatDot.classList.remove('active'), 75);
        if (e.data.bpm) bpmBadge.textContent = `${Math.round(e.data.bpm)} BPM`;
      }
    });

    function onSelectPreset() {
      const key = document.getElementById('preset-selector').value;
      const p = PRESETS[key];
      if (!p) return;
      document.getElementById('prompt-input').value = p.prompt;
      // Remotely switch montage style inside KenetiCut
      if (p.style) {
        frame.contentWindow?.postMessage({ type: 'SET_STYLE', style: p.style }, '*');
      }
    }

    // ── AI Image Generation & Real-Time Reel Streaming ──
    async function generateAndStreamReel() {
      const prompt = document.getElementById('prompt-input').value.trim();
      if (!prompt) return;

      const count = parseInt(document.getElementById('frame-count').value, 10);
      const btn = document.getElementById('gen-btn');
      const strip = document.getElementById('reel-strip');

      btn.disabled = true;
      btn.innerHTML = '<span>⏳</span> Generating...';
      strip.innerHTML = '';

      for (let i = 0; i < count; i++) {
        const seed = Math.floor(Math.random() * 9000000) + 1000000;
        // Uses Perchance's free fast AI image endpoint with seed progression
        const cleanPrompt = encodeURIComponent(prompt + `, sequential frame ${i + 1}`);
        const imgUrl = `https://image.pollinations.ai/prompt/${cleanPrompt}?seed=${seed}&width=1280&height=720&nologo=true`;

        // Create thumb in strip
        const thumb = document.createElement('img');
        thumb.className = 'reel-thumb';
        thumb.src = imgUrl;
        thumb.title = `Frame #${i + 1}`;
        strip.appendChild(thumb);
        thumb.scrollIntoView({ behavior: 'smooth', inline: 'end' });

        // Stream into KenetiCut's chop deck
        frame.contentWindow?.postMessage({
          type: 'ADD_ASSET',
          url: imgUrl,
          name: `Reel_Frame_${i + 1}`,
          mediaType: 'image'
        }, '*');

        // Stagger slightly so browser downloads are smooth
        await new Promise((r) => setTimeout(r, 450));
      }

      btn.disabled = false;
      btn.innerHTML = '<span>🎬</span> Generate Reel';
    }

    function flashSubliminal() {
      const line = BURROUGHS_LINES[Math.floor(Math.random() * BURROUGHS_LINES.length)];
      frame.contentWindow?.postMessage({ type: 'SET_SUBLIMINAL', text: line, duration: 600 }, '*');
    }

    function triggerChop() {
      frame.contentWindow?.postMessage({ type: 'TRIGGER_CHOP' }, '*');
    }

    function togglePlay() {
      frame.contentWindow?.postMessage({ type: 'TOGGLE_PLAY' }, '*');
    }
  </script>
</body>
</html>
