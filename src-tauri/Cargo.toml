[package]
name = "strangelet-kinetocut"
version = "1.0.0"
description = "Audio-reactive kinetic montage engine and vintage cinema synthesizer"
authors = ["Interzone Drive-In"]
edition = "2021"

[lib]
name = "strangelet_kinetocut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
